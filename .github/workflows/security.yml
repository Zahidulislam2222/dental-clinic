# Based on the owner's security-ci template. Manual only: no paid API review job.
# Verify repository Actions budget before dispatching on a private repository.
name: security
on: workflow_dispatch
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=low
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pipx run semgrep scan --error --config p/security-audit --metrics=off src scripts
      # Bandit applies when Python source is shipped; this static release ships none.
      # Independent review is handled in a separate session. No billed AI API is used.
